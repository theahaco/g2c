name: deploy-relayer

on:
  push:
    branches: [main]
    paths: ['infra/relayer/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-relayer
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1 tag, 2026-08-17

      - name: Load Fly token from 1Password
        uses: 1password/load-secrets-action@4a8d23b8021e62998e4c050a53028a03d1284b26 # v4 tag, 2026-08-17
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          FLY_API_TOKEN: op://theahaco/nido_fly_io/credential

      - name: Deploy
        # The positional dir sets the Docker build context (the Dockerfile's
        # COPY paths are relative to infra/relayer/); flyctl finds fly.toml there.
        run: flyctl deploy infra/relayer --remote-only --ha=false

      - name: Smoke check
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors https://nido.fly.dev/api/v1/health

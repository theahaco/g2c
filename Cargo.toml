[workspace]
resolver = "2"
members = [
    "crates/integration-tests",
    "crates/testkit",
    "crates/zk-bench",
    "contracts/*",
    # Nested under contracts/vendor/, so not matched by the "contracts/*" glob.
    "contracts/vendor/ultrahonk-soroban-verifier",
]
# examples/* are self-contained stellar-scaffold projects with their own
# workspace + toolchain; keep them out of this workspace's resolution.
# contracts/vendor itself has no Cargo.toml (only its nested crate does), so it
# must be excluded from the "contracts/*" glob or that glob fails to resolve.
exclude = ["examples", "contracts/vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
base64 = "0.22"
soroban-sdk = "27.0.2"
# admin-sep: SEP admin/upgrade contract traits (`Administratable` + `Upgradable`,
# soroban-sdk-27 `#[contracttrait]` default methods). Replaces the hand-inlined
# admin/set_admin/upgrade boilerplate that was duplicated across the policy,
# verifier, name-registry, zk-recovery-pool and factory contracts. Published by
# theahaco (https://github.com/theahaco/admin-sep); Apache-2.0.
admin-sep = "0.27.0"
# OZ stellar-contracts pinned to ec749c3b — the merge of PR #816
# ("chore: bump soroban-sdk to 27.0.2", merged 2026-07-27), i.e. the first main
# commit on soroban-sdk 27. The `stellar-accounts` package is unchanged from our
# prior 26 pin apart from the sdk-27 adaptation (spending-limit + storage). Move
# to a tagged release once one lands on soroban-sdk 27 (latest tag v0.7.2 is 26.1).
stellar-accounts = { git = "https://github.com/OpenZeppelin/stellar-contracts.git", rev = "ec749c3b75971f2c35ced1bea3e2a7e536e91cda", package = "stellar-accounts" }
stellar-registry = "0.1.0"
# soroban-sdk-tools 0.1.3 (crates.io) targets soroban-sdk 27, replacing the prior
# BlaineHeffron git fork rev (which existed only to get a soroban-sdk 26 build). We
# now depend on a published, versioned, immutable release rather than an untagged fork.
soroban-sdk-tools = "0.1.3"

[profile.contract]
overflow-checks = true
inherits = "release"
opt-level = "z"
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
